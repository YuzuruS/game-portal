<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>トイレダッシュ - 時間内に家に帰れるか!?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container"></div>
    <div style="color: white; text-align: center; font-family: Arial; margin-top: 20px; max-width: 800px; margin-left: auto; margin-right: auto;">
        <h3>🚽 トイレダッシュ</h3>
        <p>
            <strong>ストーリー:</strong> 学校から家に帰る途中、急にトイレに行きたくなった！<br>
            時間内に家に着かないと...大変なことに！
        </p>
        <h4>操作方法</h4>
        <p>
            <strong>キーボード:</strong> ←→ キーで移動、Shiftキーで走る<br>
            <strong>Switch Pro:</strong> 左スティック/D-padで移動、Bボタンで走る<br>
            <small>※コントローラーを接続して、いずれかのボタンを押してください</small>
        </p>
        <p style="font-size: 14px; margin-top: 20px; opacity: 0.8;">
            💡 <strong>ヒント:</strong> 走ると早く着くけど我慢がきつくなる。歩くと時間がかかるけど楽になる。<br>
            バランスを考えて、無事に家に帰ろう！
        </p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
