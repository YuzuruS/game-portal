<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>おつりチャレンジ！おみせやさん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- タイトル画面 -->
  <section id="screen-title" class="screen active">
    <div class="title-card">
      <div class="mascot mascot-title" id="titleMascot">🐱</div>
      <h1 class="game-title">おつり<br>チャレンジ！</h1>
      <p class="game-subtitle">おみせやさんで じょうずに おかいもの しよう</p>
      <button class="btn btn-primary btn-big" id="startBtn">はじめる ▶</button>
      <a href="../" class="btn-link">← ゲームポータルへ もどる</a>
    </div>
  </section>

  <!-- ゲーム画面 -->
  <section id="screen-game" class="screen">
    <header class="game-header">
      <div class="hud-item">
        <span class="hud-label">レベル</span>
        <span class="hud-value" id="levelValue">1</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">もんだい</span>
        <span class="hud-value" id="questionValue">1/5</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">スコア</span>
        <span class="hud-value" id="scoreValue">0</span>
      </div>
      <div class="hud-item combo-item" id="comboItem">
        <span class="hud-label">コンボ</span>
        <span class="hud-value" id="comboValue">0</span>
      </div>
    </header>

    <div class="shop-scene">
      <div class="mascot mascot-game" id="gameMascot">🐱</div>
      <div class="speech-bubble" id="speechBubble">
        <div class="product">
          <span class="product-emoji" id="productEmoji">🍎</span>
          <span class="product-name" id="productName">りんご</span>
        </div>
        <div class="product-price"><span id="priceValue">80</span>えん</div>
      </div>
    </div>

    <div class="payment-panel">
      <div class="total-display">
        <span class="total-label">だした きんがく</span>
        <span class="total-value"><span id="totalValue">0</span>えん</span>
      </div>
      <div class="selected-coins" id="selectedCoins"></div>

      <div class="coin-tray" id="coinTray"></div>

      <div class="panel-buttons">
        <button class="btn btn-primary btn-pay" id="payBtn" disabled>これで はらう！</button>
      </div>
    </div>

    <div class="feedback-overlay" id="feedbackOverlay">
      <div class="feedback-card" id="feedbackCard">
        <div class="feedback-face" id="feedbackFace">🎉</div>
        <div class="feedback-text" id="feedbackText">パーフェクト！</div>
        <div class="feedback-sub" id="feedbackSub"></div>
        <button class="btn btn-primary" id="nextBtn">つぎへ ▶</button>
      </div>
    </div>

    <div class="confetti-layer" id="confettiLayer"></div>
  </section>

  <!-- レベルクリア画面 -->
  <section id="screen-levelclear" class="screen">
    <div class="clear-card">
      <div class="clear-title">レベル <span id="clearedLevel">1</span> クリア！</div>
      <div class="stars" id="clearStars">
        <span class="star">⭐</span><span class="star">⭐</span><span class="star">⭐</span>
      </div>
      <div class="clear-score">スコア：<span id="clearScore">0</span></div>
      <button class="btn btn-primary btn-big" id="nextLevelBtn">つぎの レベルへ ▶</button>
    </div>
  </section>

  <!-- 全クリア画面 -->
  <section id="screen-finalclear" class="screen">
    <div class="clear-card">
      <div class="mascot mascot-final" id="finalMascot">🎉</div>
      <div class="clear-title">ぜんぶ クリア！<br>おめでとう！</div>
      <div class="clear-score">さいしゅうスコア：<span id="finalScore">0</span></div>
      <button class="btn btn-primary btn-big" id="restartBtn">もういちど あそぶ</button>
      <a href="../" class="btn-link">← ゲームポータルへ もどる</a>
    </div>
  </section>

</div>
<script src="game.js"></script>
</body>
</html>
